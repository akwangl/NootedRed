name: CI

on:
  push:
    branches:
      - "*"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: macos-latest
    permissions:
      contents: write
      discussions: write
    env:
      AppleForgePath: ${{ github.workspace }}/third_party/AppleForge
    steps:
      - uses: actions/checkout@v7
      - name: Fetch AppleForge dependencies
        run: |
          git clone --depth 1 https://github.com/acidanthera/Lilu third_party/AppleForge/Lilu
          git clone --depth 1 https://github.com/acidanthera/MacKernelSDK third_party/AppleForge/MacKernelSDK
      - run: brew install xmake
      - run: xmake f -m debug -y && xmake -y
      - run: xmake f -m releasedbg -y && xmake -y
      - run: xmake f -m release -y && xmake -y
      - name: Upload to Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/branches/*/*/*/*/*.zip
      - name: Upload build
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          shopt -s nullglob
          files=(build/branches/*/*/*/*/*.zip)
          [ ${#files[@]} -gt 0 ] || { echo "No zip files found"; exit 1; }
          NOTES=$(awk -v ver="${{ github.ref_name }}" '
            $0 ~ "^## " ver "([[:space:]]|$)" {flag=1; next}
            /^## / {flag=0}
            flag
          ' CHANGELOG.md | sed 's/^### /## /')

          [ -n "$NOTES" ] || {
            echo "No changelog entry found for ${{ github.ref_name }}"
            exit 1
          }

          echo "$NOTES" | gh release create "${{ github.ref_name }}" "${files[@]}" \
            -t "${{ github.ref_name }}" \
            --verify-tag \
            --fail-on-no-commits \
            --discussion-category Announcements \
            -F -
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
